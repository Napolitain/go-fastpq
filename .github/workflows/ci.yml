name: CI

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: 1.26.x
          cache: true

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            printf '%s\n' "$unformatted"
            echo "Go files must be formatted with gofmt."
            exit 1
          fi

      - name: Verify module files are tidy
        run: |
          go mod tidy
          files="go.mod"
          if [ -f go.sum ]; then
            files="$files go.sum"
          fi
          git diff --exit-code -- $files

      - name: Run golangci-lint
        run: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.11.4 run ./...

      - name: Run tests with coverage
        run: go test -v -coverprofile=coverage.out -covermode=atomic ./...

      - name: Build packages
        run: go build ./...

      - name: Run deadcode
        run: go run golang.org/x/tools/cmd/deadcode@v0.45.0 -test ./...
